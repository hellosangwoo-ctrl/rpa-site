<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EC8F8"/>
      <stop offset="55%" stop-color="#50AAEE"/>
      <stop offset="100%" stop-color="#6B2FCC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".25" r=".7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Apple iOS app icons: square canvas, system applies rounded mask -->
  <rect width="1024" height="1024" rx="0" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="0" fill="url(#glow)"/>
  <rect width="1024" height="1024" rx="0" fill="url(#shine)"/>

  <!-- Stylized "V1" mark — V chevron + numeral 1 forming a single glyph -->
  <g filter="url(#shadow)">
    <!-- V chevron -->
    <path d="M 270 290
             L 380 290
             L 512 600
             L 644 290
             L 754 290
             L 580 720
             L 512 720
             L 444 720
             Z"
          fill="#ffffff"/>
    <!-- numeral 1 (right of V, slimmer) -->
    <path d="M 738 720
             L 738 360
             L 690 388
             L 690 320
             L 762 280
             L 800 280
             L 800 720
             Z"
          fill="#ffffff" opacity=".96"/>
  </g>

  <!-- Subtle dot accent — represents AI insight -->
  <circle cx="800" cy="290" r="16" fill="#34C759"/>
</svg>

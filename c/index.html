<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBF6F0">
<title>예약 확인 — 오셔요</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#FBF6F0;--ink:#1F2933;--sub:#4A535C;--mute:#5B6670;--accent:#C4481A;--accent-ink:#9A3612;--card:#FFFFFF;--chip:#F1F3F5;--warn-bg:#FFF1D6;--warn-ink:#5C4300;--warn-line:#C9A24A;--soft:#EADFD3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
main{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.inapp{background:var(--warn-bg);color:var(--warn-ink);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.45}
.inapp p{margin:0;flex:1}
.inapp button{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--warn-line);background:#fff;color:var(--warn-ink);font:inherit;font-weight:600;flex-shrink:0;cursor:pointer}
.brand{padding:28px 24px 0;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:16px}
h1{margin:20px 24px 0;font-size:26px;line-height:1.35;font-weight:700}
.svc{margin:6px 24px 0;font-size:15px;color:var(--sub)}
.card{margin:20px 24px 0;background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.addr{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
.addr svg{flex-shrink:0;margin-top:2px}
.row{display:flex;gap:8px}
.chipbtn{flex:1;min-height:44px;border-radius:10px;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;text-decoration:none}
h2{margin:28px 24px 0;font-size:15px;font-weight:700}
.acts{padding:12px 24px 0;display:flex;flex-direction:column;gap:10px}
.btn{min-height:56px;border-radius:12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff;border:2px solid var(--accent)}
.btn.secondary{background:#fff;color:var(--accent-ink);border:2px solid var(--accent)}
.link{min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}
.foot{margin-top:auto;padding:28px 24px 24px;font-size:12px;line-height:1.6;color:var(--mute)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:16px}
.center .ico{width:64px;height:64px;border-radius:20px;background:var(--soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.center h1{margin:0;font-size:22px}
.center p{margin:0;font-size:15px;line-height:1.6;color:var(--sub)}
.center .btn{width:100%;min-height:52px}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible{outline:3px solid #1D5FD1;outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="inapp" id="inapp" hidden>
    <p>카카오톡 안에서 열렸어요. 버튼이 안 되면 다른 브라우저로 열어 주세요.</p>
    <button type="button" id="openExternal">브라우저로</button>
  </div>

  <section id="loading" class="center" aria-live="polite"><p>예약 정보를 불러오는 중…</p></section>

  <section id="active" hidden>
    <div class="brand"><i aria-hidden="true">오</i><span id="shopLine">예약</span></div>
    <h1 id="when"></h1>
    <p class="svc" id="svc" hidden></p>
    <div class="card">
      <div class="addr" id="addrRow" hidden>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A3612" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <div id="addr"></div>
      </div>
      <div class="row">
        <a class="chipbtn" id="mapBtn" hidden target="_blank" rel="noopener">지도 보기</a>
        <a class="chipbtn" id="telBtn" hidden>매장에 전화</a>
      </div>
    </div>
    <h2>내 캘린더에 저장</h2>
    <div class="acts" id="acts">
      <a class="btn primary" id="appleBtn">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        아이폰 캘린더에 추가</a>
      <a class="btn secondary" id="googleBtn" target="_blank" rel="noopener">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>
        구글 캘린더에 추가 (갤럭시)</a>
      <a class="link" id="icsBtn">다른 캘린더 앱 (일정 파일 받기)</a>
    </div>
    <p class="foot">이 페이지는 예약 시간이 지나면 닫힙니다.<br>일정 변경은 매장으로 연락해 주세요. 캘린더에 저장한 일정은 자동으로 바뀌지 않습니다.</p>
  </section>

  <section id="closed" class="center" hidden>
    <div class="ico"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <h1 id="closedTitle">지난 예약이에요</h1>
    <p id="closedText">이 링크는 예약 시간이 지나 더 이상 열리지 않습니다.<br>새 예약은 매장으로 문의해 주세요.</p>
    <a class="btn primary" id="closedTel" hidden>매장에 전화하기</a>
  </section>
</main>
<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://awnumaschuictuclucmt.supabase.co";
  var SUPABASE_KEY = "sb_publishable_JPdIb72UcP7lZfmOtFXflg_GFMh_0tT"; // 공개용(publishable) 키. 페이지가 부르는 것은 cal_event 뿐
  var TOKEN_RE = /^[A-Za-z0-9]{10}$/;
  var $ = function (id) { return document.getElementById(id); };
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  function show(id) {
    ["loading", "active", "closed"].forEach(function (s) { $(s).hidden = s !== id; });
  }

  if (/KAKAOTALK/i.test(ua)) {
    $("inapp").hidden = false;
    $("openExternal").addEventListener("click", function () {
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    });
  }

  function icsUtc(iso) { return new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
  function title(ev) { var s = ev.shop_name || "매장"; return ev.service_name ? s + " " + ev.service_name + " 예약" : s + " 예약"; }
  function details(ev) { return (ev.shop_phone ? "매장 전화 " + ev.shop_phone + "\n" : "") + "일정 변경은 매장으로 연락해 주세요."; }
  function googleUrl(ev) {
    var p = new URLSearchParams({ action: "TEMPLATE", text: title(ev), dates: icsUtc(ev.starts_at) + "/" + icsUtc(ev.ends_at), details: details(ev), ctz: "Asia/Seoul" });
    if (ev.shop_address) p.set("location", ev.shop_address);
    return "https://calendar.google.com/calendar/render?" + p.toString();
  }
  function whenText(iso) {
    var d = new Date(iso);
    var date = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short" }).formatToParts(d);
    var get = function (t) { var x = date.filter(function (p) { return p.type === t; })[0]; return x ? x.value : ""; };
    var time = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", hour: "numeric", minute: "2-digit" }).format(d);
    return { date: get("month") + "월 " + get("day") + "일(" + get("weekday") + ")", time: time };
  }
  function minutes(a, b) { return Math.round((new Date(b) - new Date(a)) / 60000); }
  function durText(m) { if (!(m > 0)) return ""; var h = Math.floor(m / 60), r = m % 60; return "약 " + (h ? h + "시간" : "") + (h && r ? " " : "") + (r ? r + "분" : ""); }
  function telHref(p) { return "tel:" + String(p).replace(/[^0-9+]/g, ""); }

  function renderClosed(ev, kind) {
    if (kind === "notfound") {
      $("closedTitle").textContent = "예약을 찾을 수 없어요";
      $("closedText").textContent = "링크가 잘못되었거나 만료되었습니다. 매장으로 문의해 주세요.";
    } else if (kind === "error") {
      $("closedTitle").textContent = "잠시 후 다시 열어 주세요";
      $("closedText").textContent = "예약 정보를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";
    } else if (kind === "canceled") {
      $("closedTitle").textContent = "취소된 예약이에요";
      $("closedText").textContent = "이 예약은 취소되었습니다. 새 예약은 매장으로 문의해 주세요.";
    }
    if (ev && ev.shop_phone) {
      $("closedTel").href = telHref(ev.shop_phone);
      $("closedTel").textContent = (ev.shop_name ? ev.shop_name + "에 " : "매장에 ") + "전화하기";
      $("closedTel").hidden = false;
    }
    show("closed");
  }

  function renderActive(ev, token) {
    var w = whenText(ev.starts_at);
    document.title = (ev.shop_name || "매장") + " 예약 — 오셔요";
    $("shopLine").textContent = (ev.shop_name || "매장") + " 예약";
    $("when").innerHTML = "";
    $("when").appendChild(document.createTextNode(w.date));
    $("when").appendChild(document.createElement("br"));
    $("when").appendChild(document.createTextNode(w.time));
    var svc = [ev.service_name, durText(minutes(ev.starts_at, ev.ends_at))].filter(Boolean).join(", ");
    if (svc) { $("svc").textContent = svc; $("svc").hidden = false; }
    if (ev.shop_address) {
      $("addr").textContent = ev.shop_address; $("addrRow").hidden = false;
      $("mapBtn").href = "https://map.naver.com/p/search/" + encodeURIComponent(ev.shop_address); $("mapBtn").hidden = false;
    }
    if (ev.shop_phone) { $("telBtn").href = telHref(ev.shop_phone); $("telBtn").hidden = false; }

    var ics = SUPABASE_URL + "/functions/v1/cal?t=" + encodeURIComponent(token);
    $("appleBtn").href = ics;
    $("icsBtn").href = ics + "&dl=1";
    $("googleBtn").href = googleUrl(ev);
    if (isAndroid && !isIOS) $("acts").insertBefore($("googleBtn"), $("appleBtn")); // 갤럭시는 구글을 위로
    if (isAndroid) { $("googleBtn").className = "btn primary"; $("appleBtn").className = "btn secondary"; }
    show("active");
  }

  var token = new URLSearchParams(location.search).get("t") || "";
  if (!TOKEN_RE.test(token)) { renderClosed(null, "notfound"); return; }

  var ctrl = typeof AbortController === "function" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
  fetch(SUPABASE_URL + "/rest/v1/rpc/cal_event", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, authorization: "Bearer " + SUPABASE_KEY, "content-type": "application/json" },
    body: JSON.stringify({ p_token: token }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) {
    if (!r.ok) throw new Error("rpc " + r.status);
    return r.json();
  }).then(function (rows) {
    clearTimeout(timer);
    var ev = rows && rows[0];
    if (!ev) return renderClosed(null, "notfound");
    if (ev.state === "active" && ev.starts_at && ev.ends_at) return renderActive(ev, token);
    renderClosed(ev, ev.state === "canceled" ? "canceled" : "expired");
  }).catch(function () { clearTimeout(timer); renderClosed(null, "error"); });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<title>방문 감사 — 오셔요</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--card:#fff;--ink:#17191C;--sub:#4A5059;--mute:#6B727C;--line:#E6E8EB;--fill:#EEF0F2;--accent:#C4481A;--accent-ink:#9E3913;--ok:#1F7A4D;--ok-bg:#E8F3EE;--warn-bg:#FBF1E4;--warn:#7A4100}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font-family:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%;line-height:1.5}
main{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1D5FD1;outline-offset:2px}
.top{padding:28px 20px 8px}
.top .shop{font-size:13px;color:var(--sub)}
.top h1{margin:6px 0 0;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-.02em}
.top p{margin:6px 0 0;color:var(--sub);font-size:14px}
.box{margin:16px 20px 0;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-size:16px;font-weight:700}
.ph{display:flex;gap:12px;align-items:center}
.ph img{width:92px;height:92px;border-radius:12px;object-fit:cover;background:var(--fill);flex-shrink:0}
.ph p{margin:0;font-size:13px;color:var(--sub);line-height:1.55}
.facts{margin:0;padding:0;list-style:none;font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.two{display:flex;gap:8px}
.btn{flex:1;min-height:48px;border-radius:12px;border:0;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0 14px}
.btn.pri{background:var(--accent);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.sec{background:#fff;border:1px solid #D5D9DE;color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.state{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--fill);font-size:14px;font-weight:500}
.state.ok{background:var(--ok-bg);color:var(--ok)}
.small{margin:0;font-size:12px;color:var(--mute);line-height:1.5}
.last{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--ink);border-radius:14px;text-decoration:none;color:inherit}
.last img,.rec img,.last .noimg,.rec .noimg{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--fill);flex-shrink:0}
.last .t,.rec .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.last b,.rec b{font-size:15px}
.last span,.rec span{font-size:12px;color:var(--sub)}
.rec{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:6px 0}
.why{align-self:flex-start;font-size:11px!important;font-weight:500;padding:2px 6px;border-radius:5px;background:var(--fill);color:var(--sub)!important}
.why.wish{background:var(--warn-bg);color:var(--warn)!important}
.err{margin:12px 20px 0;padding:12px 14px;border-radius:12px;background:#FDECEA;color:#B42318;font-size:14px}
.foot{margin-top:auto;padding:16px 20px 28px;font-size:11px;color:var(--mute);line-height:1.55}
.foot a{color:var(--accent-ink)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:10px;color:var(--sub)}
</style>
</head>
<body>
<main>
  <section id="vLoad" class="center"><p>불러오는 중이에요</p></section>
  <section id="vMsg" class="center" hidden><h1 style="font-size:20px;color:var(--ink);margin:0">링크를 찾을 수 없어요</h1><p>기간이 지났거나 주소가 잘못됐어요. 매장에 문의해 주세요.</p></section>
  <section id="vPage" hidden style="display:flex;flex-direction:column;flex:1">
    <div class="top">
      <div class="shop" id="shop"></div>
      <h1 id="hello"></h1>
      <p id="visit" hidden></p>
    </div>
    <div id="photos"></div>
    <div class="err" id="err" role="alert" hidden></div>
    <div class="box" id="next" hidden>
      <h2>다음 예약</h2>
      <div id="lastBox"></div>
      <div id="recs"></div>
    </div>
    <p class="foot">이 링크는 문자를 받은 분께만 보낸 거예요. 다른 사람에게 보내지 말아 주세요. 사진 미리보기와 동의는 30일 동안 열려요. 개인정보 처리자: <span id="ctrl"></span>, 보관 위탁: 오셔요(리지포인트 어드바이저리). <a href="https://hellosangwoo-ctrl.github.io/vione-legal/privacy-policy.html" target="_blank" rel="noopener">개인정보 처리방침</a></p>
  </section>
</main>
<script src="/p/look-core.js"></script>
<script>
(function () {
  "use strict";
  var L = window.LookCore;
  var FN = "https://awnumaschuictuclucmt.supabase.co/functions/v1/guest-page";
  var $ = function (id) { return document.getElementById(id); };
  var tok = L.parseToken(location.href);
  var D = null, busy = false;

  function show(id) { ["vLoad", "vMsg", "vPage"].forEach(function (v) { $(v).hidden = v !== id; }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function tel(p) { return "tel:" + String(p).replace(/[^0-9+]/g, ""); }

  function load() {
    return fetch(FN + "?t=" + encodeURIComponent(tok), { headers: { accept: "application/json" } })
      .then(function (r) { if (r.status === 404) return null; if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  var LABEL = { consent: "올려도 돼요", decline: "올리지 않을게요", withdraw: "공개 철회" };
  function answer(photo, action) {
    if (busy) return;
    if (action === "withdraw" && !confirm("포트폴리오에서 이 사진을 내릴까요?")) return;
    busy = true; $("err").hidden = true;
    fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: tok, photo: photo, action: action }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        busy = false;
        if (!x.ok || !x.j.ok) { $("err").textContent = x.j && x.j.error === "expired" ? "링크 기간이 지났어요. 매장에 말씀해 주세요." : "처리하지 못했어요. 잠시 후 다시 해 주세요."; $("err").hidden = false; return; }
        D.photos.forEach(function (p) { if (p.id === photo) p.state = x.j.state; });
        renderPhotos();
      })
      .catch(function () { busy = false; $("err").textContent = "인터넷 연결을 확인해 주세요."; $("err").hidden = false; });
  }

  function renderPhotos() {
    var box = $("photos"); box.innerHTML = "";
    (D.photos || []).forEach(function (p) {
      var b = el("div", "box");
      b.appendChild(el("h2", null, p.state === "pending" ? "오늘 사진, 포트폴리오에 올려도 될까요?" : "오늘 사진"));
      var ph = el("div", "ph");
      if (p.url) { var im = el("img"); im.src = p.url; im.alt = "오늘 시술 사진(공개될 모습)"; ph.appendChild(im); }
      ph.appendChild(el("p", null, "올라가는 사진은 이 1장이에요. 매장에서 가린 곳은 흐리게 처리된 그대로 올라가고, 이름과 연락처는 함께 올라가지 않아요."));
      b.appendChild(ph);
      var facts = el("ul", "facts");
      ["어디에: " + (D.store.name || "매장") + " 예약 페이지의 포트폴리오", "얼마나: 철회할 때까지, 길어도 2년 뒤에는 자동으로 내려가요", "철회: 이 링크에서 언제든, 누르면 바로 내려가요"]
        .forEach(function (t) { facts.appendChild(el("li", null, t)); });
      if (p.state === "pending") b.appendChild(facts);
      var v = L.photoView(p.state, D.live);
      if (v.text) { var s = el("div", "state" + (p.state === "public" ? " ok" : ""), v.text); b.appendChild(s); }
      if (v.actions.length) {
        var two = el("div", "two");
        v.actions.forEach(function (a) {
          var btn = el("button", "btn " + (a === "consent" ? "dark" : "sec"), LABEL[a]); btn.type = "button";
          btn.addEventListener("click", function () { answer(p.id, a); }); two.appendChild(btn);
        });
        b.appendChild(two);
      }
      if (p.state === "pending") b.appendChild(el("p", "small", "고르지 않으면 올리지 않아요. 어느 쪽이든 예약에는 아무 영향이 없어요. 만 14세 미만이면 보호자와 함께 골라 주세요."));
      box.appendChild(b);
    });
  }

  function renderNext() {
    var st = D.store, last = D.last, has = false;
    var lb = $("lastBox"); lb.innerHTML = "";
    if (last && (last.service_name || last.service_id)) {
      var href = st.slug ? L.bookHref(st.slug, { service_id: last.service_id, service_name: last.service_name, tags: last.tags }, last.staff_name) : (st.phone ? tel(st.phone) : null);
      if (href) {
        var a = el("a", "last"); a.href = href;
        if (last.url) { var im = el("img"); im.src = last.url; im.alt = ""; a.appendChild(im); } else a.appendChild(el("span", "noimg"));
        var t = el("span", "t"); t.appendChild(el("b", null, "오늘과 같은 스타일로"));
        t.appendChild(el("span", null, [last.service_name, last.staff_name].filter(Boolean).join(", ")));
        a.appendChild(t); lb.appendChild(a); has = true;
      }
    }
    var rb = $("recs"); rb.innerHTML = "";
    if (st.slug && (D.recs || []).length) {
      rb.appendChild(el("p", "small", "비슷한 스타일"));
      D.recs.slice(0, 4).forEach(function (r) {
        var a = el("a", "rec"); a.href = L.bookHref(st.slug, r, r.staff_name);
        if (r.url) { var im = el("img"); im.src = r.url; im.alt = r.service_name || "시술 사진"; im.loading = "lazy"; a.appendChild(im); }
        else a.appendChild(el("span", "noimg"));
        var t = el("span", "t"); t.appendChild(el("b", null, r.service_name || "시술"));
        t.appendChild(el("span", null, [r.staff_name, L.fmtWon(r.price_from)].filter(Boolean).join(", ")));
        t.appendChild(el("span", "why" + (r.wish ? " wish" : ""), L.whyText(r, "ko")));
        a.appendChild(t); rb.appendChild(a);
      });
      has = true;
    }
    if (!has && st.slug) { var a2 = el("a", "btn pri", "예약하기"); a2.href = "/b/" + st.slug; lb.appendChild(a2); has = true; }
    if (!has && st.phone) { var a3 = el("a", "btn sec", "매장에 전화하기"); a3.href = tel(st.phone); lb.appendChild(a3); has = true; }
    $("next").hidden = !has;
  }

  function render() {
    var st = D.store;
    document.title = (st.name || "매장") + " 방문 감사 — 오셔요";
    $("shop").textContent = [st.name, D.visit && D.visit.staff_name].filter(Boolean).join(", ");
    $("hello").textContent = (D.customer ? D.customer + "님, " : "") + "와 주셔서 감사해요";
    if (D.visit && D.visit.service_name) { $("visit").textContent = "오늘 시술: " + D.visit.service_name; $("visit").hidden = false; }
    $("ctrl").textContent = st.name || "매장";
    renderPhotos(); renderNext();
    show("vPage");
  }

  if (!tok) { show("vMsg"); return; }
  load().then(function (d) { if (!d) { show("vMsg"); return; } D = d; render(); }).catch(function () { show("vMsg"); });
})();
</script>
</body>
</html>
